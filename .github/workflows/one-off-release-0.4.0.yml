name: Publish Smartify Manager v0.4.0 (one-off)

on:
  push:
    branches:
      - release/0.4.0

permissions:
  contents: write

concurrency:
  group: smartify-manager-v0.4.0-publish
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install offline test dependency
        run: python -m pip install --disable-pip-version-check aiohttp

      - name: Check Python syntax and JSON
        run: |
          python -m compileall -q custom_components cubi tests
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/smartify_app_manager/manifest.json >/dev/null
          python -m json.tool cubi/app-recipes.json >/dev/null
          python -m json.tool cubi/package-policy.example.json >/dev/null

      - name: Check app-manager version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("custom_components/smartify_app_manager/manifest.json").read_text())
          assert m["version"] == "0.4.0", m["version"]
          assert "v0.4.0" in Path("custom_components/smartify_app_manager/frontend/panel.js").read_text()
          print("Manager and frontend versions: 0.4.0")
          PY

      - name: Run offline security and catalog tests
        env:
          PYTHONPATH: cubi
        run: python -m unittest discover -s tests -v

      - name: JavaScript syntax
        run: node --check custom_components/smartify_app_manager/frontend/panel.js

      - name: Prepare standalone installation ZIP
        run: |
          find custom_components -type d -name __pycache__ -prune -exec rm -rf {} +
          mkdir -p dist
          zip -q -r dist/smartify-app-manager-0.4.0.zip             custom_components/smartify_app_manager hacs.json README.md RELEASE_0.4.0.md
          sha256sum dist/smartify-app-manager-0.4.0.zip             | tee dist/smartify-app-manager-0.4.0.zip.sha256

      - name: Publish GitHub release after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.4.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release 0.4.0 already exists; not modifying it."
            exit 0
          fi
          gh release create 0.4.0             --repo "${GITHUB_REPOSITORY}"             --target "${GITHUB_SHA}"             --title "Smartify App Manager 0.4.0 – Cubi Testrelease"             --notes-file RELEASE_0.4.0.md             --latest             dist/smartify-app-manager-0.4.0.zip             dist/smartify-app-manager-0.4.0.zip.sha256
