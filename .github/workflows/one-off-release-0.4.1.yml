name: Smartify Manager v0.4.1 testrelease (one-off)

on:
  push:
    branches:
      - release/0.4.1

permissions:
  contents: write

concurrency:
  group: smartify-manager-v0.4.1-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline test dependency
        run: python -m pip install --disable-pip-version-check aiohttp
      - name: Check Python and JSON
        run: |
          python -m compileall -q custom_components cubi tests
          python -m json.tool custom_components/smartify_app_manager/manifest.json >/dev/null
          python -m json.tool cubi/app-recipes.json >/dev/null
      - name: Verify 0.4.1 versions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("custom_components/smartify_app_manager/manifest.json").read_text())
          assert m["version"] == "0.4.1", m["version"]
          js=Path("custom_components/smartify_app_manager/frontend/panel.js").read_text()
          assert "v0.4.1" in js
          PY
      - name: Run all offline regression tests
        env:
          PYTHONPATH: cubi
        run: python -m unittest discover -s tests -v
      - name: Check panel JavaScript
        run: node --check custom_components/smartify_app_manager/frontend/panel.js
      - name: Package and checksum
        run: |
          find custom_components -type d -name __pycache__ -prune -exec rm -rf {} +
          mkdir -p dist
          zip -q -r dist/smartify-app-manager-0.4.1.zip \
            custom_components/smartify_app_manager hacs.json README.md RELEASE_0.4.1.md
          sha256sum dist/smartify-app-manager-0.4.1.zip | tee dist/smartify-app-manager-0.4.1.zip.sha256
      - name: Publish after tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.4.1 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release 0.4.1 already exists; not modifying it"
            exit 0
          fi
          gh release create 0.4.1 \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "Smartify App Manager 0.4.1 – Cubi Icon & Sync Fix" \
            --notes-file RELEASE_0.4.1.md \
            --latest \
            dist/smartify-app-manager-0.4.1.zip \
            dist/smartify-app-manager-0.4.1.zip.sha256
